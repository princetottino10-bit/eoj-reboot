# Fly.io config for the PUBLIC build of the table (online/server.ts --public):
# the decided rules and cards only, the printed card faces/backs and board, no
# settings page, no proposals, no /records. It is a separate app from the test
# table (fly.toml), so the team keeps its settings and rooms there.
#
# Not deployed yet. To put it up (once the team says so):
#   fly apps create <name>            # pick a free name, then set `app` below to it
#   fly volumes create records -a <name> -r nrt -n 1 -s 1
#   fly deploy -c fly.public.toml --ha=false
# Before each deploy: all tests pass, and /healthz shows rooms=0.
app = "onmyo-fujin-public"
primary_region = "nrt"

[build]
  dockerfile = "Dockerfile"

[processes]
  app = "node --experimental-strip-types online/server.ts --host 0.0.0.0 --port 8080 --trust-proxy --record-dir /app/out/online --public"

[mounts]
  source = "records"
  destination = "/app/out"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [http_service.concurrency]
    type = "connections"
    soft_limit = 300
    hard_limit = 400

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/healthz"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
