# Fly.io config for the sim2 online server. Deploy from this directory:
#   fly deploy --ha=false
# Rooms are kept in memory, so the app must run on exactly ONE machine that
# never auto-stops (a second machine would split the rooms between them).
app = "onmyo-fujin-eee5ac"
primary_region = "nrt"

[build]
  dockerfile = "Dockerfile"

# Match records (--record-dir /app/out/online) live on a volume, so they survive
# a redeploy and a machine replacement. Create it once, in the same region and
# with exactly ONE copy (a second one would need a second machine):
#   fly volumes create records -r nrt -n 1 -s 1
# Read them back with `fly ssh console -C "ls /app/out/online"` and
# `fly ssh sftp get /app/out/online/<file>` - they are never served over HTTP.
[mounts]
  source = "records"
  destination = "/app/out"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "connections"
    soft_limit = 300
    hard_limit = 400

  # /healthz is a few counters; / would re-serve the lobby page every 30s
  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/healthz"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
